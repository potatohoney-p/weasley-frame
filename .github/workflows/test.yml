name: Offline regression tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --prefix backend
      # Frontend follows the existing release install; it does not track an npm lockfile.
      - run: npm install --ignore-scripts --package-lock=false --prefix frontend
      - run: npm test
      - run: npm run test:backend
      - run: npm run build --prefix backend
      - run: npx --no-install tsc --noEmit
        working-directory: frontend
